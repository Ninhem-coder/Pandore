# Configuration Alembic (2026-09-12) — migrations de schéma du serveur Vanitas.
# `sqlalchemy.url` n'est PAS renseigné ici : env.py le dérive de `app.db.DATABASE_URL` (source
# unique), avec un override optionnel `ALEMBIC_DATABASE_URL` pour l'outillage/les tests.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
