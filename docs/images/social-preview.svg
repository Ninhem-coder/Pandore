<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Pandore — social preview</title>
  <desc id="d">Pandore: security posture dashboard for Microsoft Intune and Defender for Endpoint, with Vanitas, a self-hosted Windows endpoint agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#10162A"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.2" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#F6B27E" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F6B27E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#39E6D2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#39E6D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6B27E"/>
      <stop offset="1" stop-color="#EE9A5C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowAmber)"/>
  <rect width="1280" height="640" fill="url(#glowCyan)"/>

  <g transform="translate(565 92) scale(2.5)">
    <path d="M30 0 C42 6 52 8 60 8 C60 34 52 52 30 62 C8 52 0 34 0 8 C8 8 18 6 30 0 Z" fill="url(#shield)"/>
    <circle cx="30" cy="28" r="7" fill="#0A0E1A"/>
    <path d="M26.5 32 L33.5 32 L31 44 L29 44 Z" fill="#0A0E1A"/>
  </g>

  <text x="640" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="600" fill="#F3EFE8" letter-spacing="-1">Pandore</text>
  <text x="640" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#A9AFC0">Security posture dashboard for Microsoft Intune</text>
  <text x="640" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#A9AFC0">and Defender for Endpoint — with <tspan fill="#39E6D2" font-weight="600">Vanitas</tspan>,</text>
  <text x="640" y="502" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#A9AFC0">a self-hosted Windows endpoint agent.</text>
  <text x="640" y="572" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" fill="#6E7690" letter-spacing="1.5">REACT · FASTAPI · MICROSOFT GRAPH · .NET · mTLS · MCP</text>
</svg>
