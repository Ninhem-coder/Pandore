<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090B"/>
      <stop offset="100%" stop-color="#0D1114"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 60) rotate(-45) scale(34)">
      <stop offset="0%" stop-color="#39E6D2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39E6D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ping" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D14FE0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D14FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#vbg)"/>

  <!-- radar sweep wedge -->
  <path d="M60 60 L60 26 A34 34 0 0 1 84 36 Z" fill="url(#sweep)"/>

  <!-- outer scan ring, faint -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="#213038" stroke-width="1.5"/>

  <!-- reticle ring -->
  <circle cx="60" cy="60" r="20" fill="none" stroke="#39E6D2" stroke-width="2.5"/>

  <!-- crosshair ticks, extending past the ring -->
  <g stroke="#39E6D2" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="30" x2="60" y2="40"/>
    <line x1="60" y1="80" x2="60" y2="90"/>
    <line x1="30" y1="60" x2="40" y2="60"/>
    <line x1="80" y1="60" x2="90" y2="60"/>
  </g>

  <!-- center reticle dot -->
  <circle cx="60" cy="60" r="3" fill="#39E6D2"/>

  <!-- target ping (magenta), off-axis, with pulse ring -->
  <circle cx="78" cy="42" r="10" fill="url(#ping)"/>
  <circle cx="78" cy="42" r="3.5" fill="#D14FE0"/>
</svg>
